name: Alberta Referendum Donations Tracker

on:
  schedule:
    # Run every 2 hours on Friday and Saturday (UTC) to catch weekly updates promptly
    - cron: '0 */2 * * 5,6'
    # Run once daily Sunday to Thursday (12:00 UTC) to check for mid-week registrations
    - cron: '0 12 * * 0-4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force scraper run (ignores date-check)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run donations tracker
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          # Check if manual run with force parameter
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scraper.py --force
          else
            python scraper.py
          fi

      - name: Commit and push database changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/state.json data/referendum_donations.csv
          
          # Check if there are changes to commit
          if ! git diff --cached --quiet; then
            # Load update date exported by python script, fallback to current time
            COMMIT_DATE="${{ env.UPDATE_DATE }}"
            if [ -z "$COMMIT_DATE" ]; then
              COMMIT_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            fi
            
            git commit -m "Update referendum donations data: $COMMIT_DATE"
            git push
            echo "Changes pushed successfully!"
          else
            echo "No database changes to commit."
          fi
